embedding:
  input_feat:
    - "intensity"
    - "xyz"
    - "radius"
  voxel_size: 0.1
  neighbors: 16
  cin: 5
  chidden: 128
  num_layers: 4

vit:
  dim: 768
  depth: 12
  num_heads: 12
  expansion: 4.0
  drop_prob: 0.5
  bev_size: 0.5
  density_encoding: false
  budgeted_adaptive_router:
    enabled: true
    fine_size: 0.5
    coarse_factor: 2
    token_ratio: 0.85
    sparse_weight: 1.0
    detail_weight: 1.0
    semantic_weight: 0.0
    score_noise: 0.0
    detail_relay: true
  sparse_batch_reindex: true

merge_head:
  chidden: 128
  cout: 128

classif:
  nb_class: 19

dataloader:
  batch_size: 8
  num_workers: 16

augmentations:
  rotation:
    - [2, 6]
  flip:
    - [0, 1]
    - [4, 5]
  scale:
    - [0, 1, 2]
    - [4, 5, 6, 7]
    - 0.1
  pillarmix:
    - 7.5
    - 3
    - 8
  instance_cutmix: true

loss:
  lovasz: 1.0

optim:
  lr: 0.001
  weight_decay: 0.003

scheduler:
  min_lr: 0.0
  max_epoch: 17
  epoch_warmup: 4
